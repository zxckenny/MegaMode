name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check project files
        shell: bash
        run: |
          ls -la
          test -f mod.json || { echo "mod.json not found in repo root"; exit 1; }
          test -f CMakeLists.txt || { echo "CMakeLists.txt not found in repo root"; exit 1; }
          test -f src/main.cpp || { echo "src/main.cpp not found"; exit 1; }

      - name: Set latest stable Geode version in mod.json
        shell: bash
        run: |
          V=$(git ls-remote --tags --refs https://github.com/geode-sdk/geode | sed 's|.*refs/tags/||' | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1)
          echo "Using Geode $V"
          jq --arg v "$V" '.geode = $v' mod.json > mod.tmp
          mv mod.tmp mod.json

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
